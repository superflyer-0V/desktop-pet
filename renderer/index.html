<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" />
  <title>桌宠</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    #stage { width: 100%; height: 100%; }

    #bubble {
      position: fixed;
      transform: translate(-50%, -100%);
      max-width: 260px;
      max-height: 190px;
      overflow-y: auto;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(24, 24, 28, 0.92);
      color: #f2f2f5;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.2s;
      word-break: break-word;
      white-space: pre-wrap;
      scrollbar-width: thin;
    }
    #bubble.visible { opacity: 1; }
    /* 头顶空间不够时向下展开，避免被窗口上沿裁切 */
    #bubble.down { transform: translate(-50%, 0); }

    #chatbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(24, 24, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 6px 8px;
      box-sizing: border-box;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    #chatbar.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    #chat-input {
      width: 260px;
      border: none;
      outline: none;
      background: transparent;
      color: #f2f2f5;
      font-size: 13px;
      padding: 4px 6px;
    }
    #chat-input::placeholder { color: rgba(242, 242, 245, 0.4); }
    #chat-send {
      border: none;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.12);
      color: #f2f2f5;
      font-size: 13px;
      padding: 5px 12px;
      cursor: pointer;
    }
    #chat-send:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble"></div>
  <div id="chatbar">
    <input id="chat-input" type="text" maxlength="200" placeholder="想跟我说点什么…" />
    <button id="chat-send">发送</button>
  </div>
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./bundle.js"></script>
</body>
</html>
